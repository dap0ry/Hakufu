name: build

# Compila, pasa los tests y genera la app en los tres sistemas en cada push o PR,
# y la de iPhone/iPad (job ios: .ipa sin firmar y capturas en el simulador).
# Los paquetes quedan como "artifacts" de la ejecución (pestaña Actions).
# Al subir un tag vX.Y.Z además publica la release en GitHub con los cuatro
# paquetes portables, los instaladores de Velopack y sus archivos de
# actualización (la landing de web/ y UpdateService leen la última):
#   git tag v0.11.0 && git push origin v0.11.0
# Un tag con guion (v0.11.0-beta.1) sale como pre-release: nadie la recibe.
on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
    paths-ignore: ["web/**", "**.md"]
  pull_request:
    paths-ignore: ["web/**", "**.md"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest      # Apple Silicon
            rid: osx-arm64
          - os: macos-latest      # Intel (se compila de forma cruzada)
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        # Una vez por sistema basta (el de osx-x64 comparte máquina con osx-arm64).
        if: matrix.rid != 'osx-x64'
        run: dotnet test tests/Hakufu.Tests -c Release

      - name: Publicar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/publish.ps1 -Rid ${{ matrix.rid }}

      - name: Publicar (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash ./scripts/publish.sh ${{ matrix.rid }}

      - name: Instalar vpk
        # Misma versión que el paquete NuGet Velopack de Hakufu.csproj.
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Empaquetar con Velopack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/pack-velopack.ps1 -Rid ${{ matrix.rid }}

      - name: mksquashfs para el AppImage (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Empaquetar con Velopack (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash ./scripts/pack-velopack.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: Hakufu-${{ matrix.rid }}
          path: |
            publish/Hakufu-${{ matrix.rid }}.zip
            publish/Hakufu-${{ matrix.rid }}.tar.gz
            publish/velopack/*
          if-no-files-found: error

  # iPhone/iPad (ver docs/superpowers/specs/2026-10-08-ios-design.md): capturas en el
  # simulador (la prueba de que arranca y pinta en iOS) y el .ipa sin firmar.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Workload de iOS
        run: dotnet workload install ios

      - name: Xcode
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Compilar para el simulador
        run: dotnet build Hakufu.csproj -p:HakufuIos=true -r iossimulator-arm64

      - name: Capturas en el simulador
        run: |
          python3 -m venv /tmp/py && /tmp/py/bin/pip install -q pillow
          PATH="/tmp/py/bin:$PATH" bash scripts/ios-simulator-shots.sh \
            bin/Debug/net10.0-ios/iossimulator-arm64/Hakufu.app publish/ios-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-ios
          path: publish/ios-shots
          if-no-files-found: ignore

      - name: .ipa sin firmar
        run: bash scripts/package-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Hakufu-ios
          path: publish/Hakufu-ios.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que el tag coincide con la versión del csproj
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Hakufu.csproj | head -1)"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::El tag es ${GITHUB_REF_NAME} pero Hakufu.csproj dice ${VERSION}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Hakufu-*   # los paquetes; no las capturas del simulador
          merge-multiple: true

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease" ;; esac
          # Los de Velopack llegan en dist/velopack/: se suben todos los archivos, sueltos.
          find dist -type f -print0 | xargs -0 gh release create "${GITHUB_REF_NAME}" \
            --title "Hakufu ${GITHUB_REF_NAME#v}" --generate-notes ${PRE}
