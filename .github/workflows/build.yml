name: build

# Compila, pasa los tests y genera la app en los tres sistemas en cada push o PR.
# Los paquetes quedan como "artifacts" de la ejecución (pestaña Actions).
# Al subir un tag vX.Y.Z además publica la release en GitHub con los cuatro
# paquetes (la landing de web/ enlaza a la última):
#   git tag v0.10.0 && git push origin v0.10.0
on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
    paths-ignore: ["web/**", "**.md"]
  pull_request:
    paths-ignore: ["web/**", "**.md"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest      # Apple Silicon
            rid: osx-arm64
          - os: macos-latest      # Intel (se compila de forma cruzada)
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        # Una vez por sistema basta (el de osx-x64 comparte máquina con osx-arm64).
        if: matrix.rid != 'osx-x64'
        run: dotnet test tests/Hakufu.Tests -c Release

      - name: Publicar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/publish.ps1 -Rid ${{ matrix.rid }}

      - name: Publicar (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash ./scripts/publish.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: Hakufu-${{ matrix.rid }}
          path: |
            publish/Hakufu-${{ matrix.rid }}.zip
            publish/Hakufu-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que el tag coincide con la versión del csproj
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Hakufu.csproj | head -1)"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::El tag es ${GITHUB_REF_NAME} pero Hakufu.csproj dice ${VERSION}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "Hakufu ${GITHUB_REF_NAME#v}" --generate-notes
